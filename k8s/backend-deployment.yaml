apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      # Init container to wait for MySQL before starting backend
      initContainers:
      - name: wait-for-mysql
        image: busybox
        command: ['sh', '-c', 'until nc -z mysql 3306; do echo "waiting for mysql"; sleep 5; done;']

      containers:
      - name: backend
        image: venkateshvgs/backend-api:latest
        ports:
        - containerPort: 5000
        env:
        - name: DB_HOST
          value: "mysql"   # should match mysql service name
        - name: DB_USER
          value: "root"
        - name: DB_PASSWORD
          value: "rootpassword"
        - name: DB_NAME
          value: "knowledge_acquisition"

        # Readiness probe to check backend health
        readinessProbe:
          httpGet:
            path: /
            port: 5000
          initialDelaySeconds: 10
          periodSeconds: 5
          failureThreshold: 5
---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
spec:
  type: LoadBalancer   # use NodePort if testing locally on Minikube/Kind
  selector:
    app: backend
  ports:
    - protocol: TCP
      port: 5000
      targetPort: 5000
